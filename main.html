<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
	<script src="script.js" defer></script> 
</head>

<body>
	<!-- the entire body must be written by student -->

    <div class="container">
		<div class="setup">
			<h1>Tic Tac Toe</h1>
			<label for="player-1">Player 1</label>
			<input type="text" id="player-1" placeholder="enter name" required>
              <br>
			<label for="player-2">Player 2</label>
			<input type="text" id="player-2" placeholder="enter name" required>

			<button id="submit" type="button">Start Game</button>
		</div>

		<div id="border">
			<h1>Tic Tac Toe</h1>
			<div class="message"></div>

            <div class="bord">
				<div class="1"></div>
				<div class="2"></div>
				<div class="3"></div>
				<div class="4"></div>
				<div class="5"></div>
				<div class="6"></div>
				<div class="7"></div>
				<div class="8"></div>
				<div class="9"></div>
			</div>
		</div>
	</div>

    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
